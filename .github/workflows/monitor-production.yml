name: Monitorar produção

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-production
  cancel-in-progress: true

jobs:
  health:
    name: Verificar API e PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Consultar rota de saúde
        id: check
        continue-on-error: true
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 https://152-67-44-170.sslip.io/health)"
          node -e 'const health = JSON.parse(process.argv[1]); if (health.status !== "ok" || health.banco !== "ok") process.exit(1)' "$response"

      - name: Abrir aviso sem duplicar
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"[Monitoramento] API LifeGuard indisponível" in:title' --json number --jq '.[0].number // empty')"
          if [[ -z "$issue_number" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title '[Monitoramento] API LifeGuard indisponível' \
              --body "A verificação externa não conseguiu confirmar a API e o PostgreSQL em $(date -u --iso-8601=seconds). Consulte a VM Oracle e os logs do serviço."
          fi

      - name: Fechar aviso após recuperação
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"[Monitoramento] API LifeGuard indisponível" in:title' --json number --jq '.[].number' | while read -r issue_number; do
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --comment 'A verificação externa confirmou que a API e o PostgreSQL voltaram ao normal.'
          done

      - name: Encerrar com falha quando indisponível
        if: steps.check.outcome == 'failure'
        run: exit 1
