services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeguard
      POSTGRES_USER: lifeguard
      POSTGRES_PASSWORD: lifeguard_dev
    ports:
      - "5432:5432"
    volumes:
      - lifeguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeguard -d lifeguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifeguard_postgres_data:
