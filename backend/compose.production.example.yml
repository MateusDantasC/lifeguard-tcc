services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeguard
      POSTGRES_USER: lifeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lifeguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeguard -d lifeguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lifeguard:${POSTGRES_PASSWORD}@postgres:5432/lifeguard?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3333
      APP_ORIGIN: ${APP_ORIGIN:-*}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    expose:
      - "3333"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - lifeguard_caddy_data:/data
      - lifeguard_caddy_config:/config

volumes:
  lifeguard_postgres_data:
  lifeguard_caddy_data:
  lifeguard_caddy_config:
